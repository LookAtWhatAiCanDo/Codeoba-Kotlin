name: Package Desktop Application

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            task: ':app-desktop:packageDmg :app-desktop:packagePkg'
            artifact-path: 'app-desktop/build/compose/binaries/main*/**/*.dmg'
            artifact-path-pkg: 'app-desktop/build/compose/binaries/main*/**/*.pkg'
            platform: macos
          - os: windows-latest
            task: ':app-desktop:packageMsi'
            artifact-path: 'app-desktop/build/compose/binaries/main*/**/*.msi'
            platform: windows
          - os: ubuntu-latest
            task: ':app-desktop:packageDeb'
            artifact-path: 'app-desktop/build/compose/binaries/main*/**/*.deb'
            platform: linux

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Extract version from tag
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            # Extract version from tag name (e.g. v1.2.3 -> 1.2.3)
            TAG_VERSION=${GITHUB_REF#refs/tags/v}
            # Strip any release/SNAPSHOT suffixes (e.g. 1.2.3-beta1 -> 1.2.3) to satisfy strict MSI/DMG requirements
            CLEAN_VERSION=$(echo "$TAG_VERSION" | cut -d'-' -f1)
            echo "APP_VERSION=$CLEAN_VERSION" >> $GITHUB_ENV
          else
            echo "APP_VERSION=1.0.0" >> $GITHUB_ENV
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set Premium Public Key
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            echo "CODEOBA_PREMIUM_PUBLIC_KEY=${{ vars.CODEOBA_PREMIUM_PUBLIC_KEY_PROD }}" >> $GITHUB_ENV
            echo "CODEOBA_FIREBASE_API_KEY=${{ vars.CODEOBA_FIREBASE_API_KEY_PROD }}" >> $GITHUB_ENV
            echo "CODEOBA_APP_SIGNATURE_HASH=${{ secrets.CODEOBA_APP_SIGNATURE_HASH_PROD }}" >> $GITHUB_ENV
            echo "CODEOBA_ENABLE_SUBSCRIPTION=true" >> $GITHUB_ENV
          else
            echo "CODEOBA_PREMIUM_PUBLIC_KEY=${{ vars.CODEOBA_PREMIUM_PUBLIC_KEY_DEV }}" >> $GITHUB_ENV
            echo "CODEOBA_FIREBASE_API_KEY=${{ vars.CODEOBA_FIREBASE_API_KEY_DEV }}" >> $GITHUB_ENV
            echo "CODEOBA_APP_SIGNATURE_HASH=${{ secrets.CODEOBA_APP_SIGNATURE_HASH_DEV }}" >> $GITHUB_ENV
            echo "CODEOBA_ENABLE_SUBSCRIPTION=true" >> $GITHUB_ENV
          fi

      - name: Install Apple Certificate
        if: matrix.platform == 'macos' && startsWith(github.ref, 'refs/tags/v')
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          INSTALLER_P12_BASE64: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_P12 }}
          INSTALLER_P12_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: "temporary_keychain_password"
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "No signing certificate secret (MACOS_CERTIFICATE_P12) found. Skipping macOS code signing setup."
            exit 0
          fi

          echo "Initializing macOS temporary keychain..."
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          INSTALLER_CERT_PATH=$RUNNER_TEMP/installer_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Decode certificates
          echo -n "$P12_BASE64" | base64 --decode > "$CERT_PATH"
          if [ -n "$INSTALLER_P12_BASE64" ]; then
            echo "Installer certificate secret detected. Decoding installer cert..."
            echo -n "$INSTALLER_P12_BASE64" | base64 --decode > "$INSTALLER_CERT_PATH"
          fi

          # Create keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import Developer ID Application cert
          echo "Importing Developer ID Application certificate..."
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign

          # Import Developer ID Installer cert if provided
          if [ -n "$INSTALLER_P12_BASE64" ]; then
            echo "Importing Developer ID Installer certificate..."
            echo "MACOS_INSTALLER_PRESENT=true" >> $GITHUB_ENV
            security import "$INSTALLER_CERT_PATH" -k "$KEYCHAIN_PATH" -P "$INSTALLER_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          fi

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # Expose signing identity dynamically (strip the prefix so it matches both Application and Installer certs)
          echo "Resolving certificate signing identity..."
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -o 'Developer ID Application: [^"]*' | head -n 1 | sed 's/Developer ID Application: //')
          
          if [ -z "$IDENTITY" ]; then
            echo "WARNING: Could not resolve a valid Developer ID Application certificate identity!"
          else
            echo "Successfully resolved macOS Signing Identity: $IDENTITY"
            echo "MACOS_SIGNING_IDENTITY=$IDENTITY" >> $GITHUB_ENV
          fi

      - name: Run Package Task
        env:
          MACOS_SIGNING_IDENTITY: ${{ env.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ vars.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          TASK_NAME="${{ matrix.task }}"
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            echo "Release tag detected. Transforming package tasks into signed release tasks..."
            # Replace package with packageRelease for all matrix tasks
            RELEASE_TASK=$(echo "$TASK_NAME" | sed 's/package/packageRelease/g')
            
            # For macOS, adjust if installer certificate is missing
            if [ "${{ matrix.platform }}" = "macos" ]; then
              if [ "$MACOS_INSTALLER_PRESENT" != "true" ]; then
                echo "No installer certificate present. Restricting release build to DMG only."
                RELEASE_TASK=":app-desktop:packageReleaseDmg"
              fi
            fi
            
            echo "Executing release build: gradlew $RELEASE_TASK"
            ./gradlew $RELEASE_TASK -PappVersion=${{ env.APP_VERSION }}
          else
            echo "Standard commit. Executing standard unsigned package build: gradlew $TASK_NAME"
            ./gradlew $TASK_NAME -PappVersion=${{ env.APP_VERSION }}
          fi

      - name: Clean Up Credentials
        if: always() && matrix.platform == 'macos' && startsWith(github.ref, 'refs/tags/v')
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
          rm -f $RUNNER_TEMP/build_certificate.p12 || true
          rm -f $RUNNER_TEMP/installer_certificate.p12 || true

      - name: Rename pre-release package files superficially
        run: |
          if [[ "$APP_VERSION" =~ ^0\. ]]; then
            # Under the hood, Gradle maps 0.x.y to 1.x.y to satisfy macOS CFBundleVersion rules.
            # Here we rename the generated file names back to 0.x.y so the user sees a pre-release version name.
            MAPPED_VERSION="1.${APP_VERSION#0.}"
            echo "Pre-release version detected ($APP_VERSION). Searching for generated files matching mapped version $MAPPED_VERSION..."
            
            # Find files containing the mapped version and rename them to use the actual version
            find app-desktop/build/compose/binaries/main* -type f \( -name "*${MAPPED_VERSION}*" \) | while read -r file; do
              new_file=$(echo "$file" | sed "s/${MAPPED_VERSION}/${APP_VERSION}/g")
              echo "Renaming $file to $new_file"
              mv "$file" "$new_file"
            done
          else
            echo "Production-level version detected ($APP_VERSION). No filename mapping required."
          fi

      - name: Upload Main Package Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Codeoba-${{ matrix.platform }}-package
          path: ${{ matrix.artifact-path }}
          retention-days: 7

      - name: Upload PKG Package Artifact (macOS only)
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: Codeoba-macos-pkg
          path: ${{ matrix.artifact-path-pkg }}
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.pkg
            artifacts/**/*.msi
            artifacts/**/*.deb
          draft: false
          prerelease: false
          generate_release_notes: true

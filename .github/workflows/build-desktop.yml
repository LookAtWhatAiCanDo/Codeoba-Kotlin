name: Package Desktop Application

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            task: ':app-desktop:packageDmg :app-desktop:packagePkg'
            artifact-path: 'app-desktop/build/compose/binaries/main/dmg/*.dmg'
            artifact-path-pkg: 'app-desktop/build/compose/binaries/main/pkg/*.pkg'
            platform: macos
          - os: windows-latest
            task: ':app-desktop:packageMsi'
            artifact-path: 'app-desktop/build/compose/binaries/main/msi/*.msi'
            platform: windows
          - os: ubuntu-latest
            task: ':app-desktop:packageDeb'
            artifact-path: 'app-desktop/build/compose/binaries/main/deb/*.deb'
            platform: linux

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Extract version from tag
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            # Extract version from tag name (e.g. v1.2.3 -> 1.2.3)
            TAG_VERSION=${GITHUB_REF#refs/tags/v}
            # Strip any release/SNAPSHOT suffixes (e.g. 1.2.3-beta1 -> 1.2.3) to satisfy strict MSI/DMG requirements
            CLEAN_VERSION=$(echo "$TAG_VERSION" | cut -d'-' -f1)
            echo "APP_VERSION=$CLEAN_VERSION" >> $GITHUB_ENV
          else
            echo "APP_VERSION=1.0.0" >> $GITHUB_ENV
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run Package Task
        run: ./gradlew ${{ matrix.task }} -PappVersion=${{ env.APP_VERSION }}

      - name: Upload Main Package Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Codeoba-${{ matrix.platform }}-package
          path: ${{ matrix.artifact-path }}

      - name: Upload PKG Package Artifact (macOS only)
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: Codeoba-macos-pkg
          path: ${{ matrix.artifact-path-pkg }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.pkg
            artifacts/**/*.msi
            artifacts/**/*.deb
          draft: false
          prerelease: false
          generate_release_notes: true
